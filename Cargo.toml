[workspace]
resolver = "2"
members = [
    ".",
    "crates/strut-sql-driver-api",
    "crates/strut-sql-driver-postgres",
    "crates/strut-sql-driver-mysql",
    "crates/strut-sql-driver-sqlite",
    "crates/strut-sql-driver-duckdb",
    "crates/strut-sql-driver-clickhouse",
    "crates/strut-sql-driver-conformance",
    "crates/strut-sql-guard",
    "crates/strut-sql-format",
    "crates/strut-sql-core",
    "crates/strut-sql-tools",
    "crates/strut-sql-server",
]

[workspace.package]
version = "2.0.0"

[package]
name = "strut-stack-sql"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Strut Stack SQL — token-efficient MCP server for MySQL, PostgreSQL, SQLite, and DuckDB"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"
homepage = "https://github.com/rzlco666/strut-stack-sql"
readme = "README.md"
keywords = ["mcp", "mysql", "postgresql", "sqlite", "sql", "ai-agent", "strut-stack"]
categories = ["command-line-utilities", "database"]
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/strut-stack-sql-{ target-family }-{ target-arch }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "strut-stack-sql"
path = "src/main.rs"

[lib]
name = "strut_stack_sql"
path = "src/lib.rs"

[dependencies]
strut-sql-driver-api = { path = "crates/strut-sql-driver-api" }
strut-sql-guard = { path = "crates/strut-sql-guard" }
strut-sql-format = { path = "crates/strut-sql-format" }
strut-sql-core = { path = "crates/strut-sql-core" }
strut-sql-tools = { path = "crates/strut-sql-tools" }
strut-sql-server = { path = "crates/strut-sql-server" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
strut-sql-driver-postgres = { path = "crates/strut-sql-driver-postgres" }
strut-sql-driver-mysql = { path = "crates/strut-sql-driver-mysql" }
strut-sql-driver-sqlite = { path = "crates/strut-sql-driver-sqlite" }
strut-sql-driver-duckdb = { path = "crates/strut-sql-driver-duckdb" }

axum = "0.8"
rmcp = { version = "2", features = ["server", "macros", "schemars", "elicitation"] }
serde_json = "1"
tempfile = "3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# Temporary upstream pin. jsonwebtoken 11.1.0 depends on p256/p384 0.13, which
# pull elliptic-curve 0.13 -> crypto-bigint 0.5.x, affected by
# RUSTSEC-2026-0387 (timing variability in constant-time operations). Upstream
# PR https://github.com/Keats/jsonwebtoken/pull/551 upgrades the curve backend to
# p256/p384 0.14 and requires crypto-bigint >= 0.7.6, with no public API change.
# Remove this patch once a jsonwebtoken release on crates.io contains it.
[patch.crates-io]
jsonwebtoken = { git = "https://github.com/Keats/jsonwebtoken", rev = "3739623abb1d0fd4d87ca7a517ddcc3310307e2d" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
