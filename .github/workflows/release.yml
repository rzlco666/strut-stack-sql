name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Soft size budget for Linux x64 binary. v2 embeds the DuckDB C++ engine,
  # so the binary measured 45,542,608 bytes in run 41947059951; the budget
  # guards against egregious bloat, not leanness.
  MAX_LINUX_X64_BYTES: "50000000"

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: strut-stack-sql-linux-x64
            check_size: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: strut-stack-sql-linux-arm64
            host_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: strut-stack-sql-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: strut-stack-sql-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: strut-stack-sql-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # The cross-rs Docker image for aarch64 (0.2.5) ships a g++ whose
      # libstdc++ headers lack <optional>, breaking the DuckDB C++ build.
      # Use Ubuntu's complete host cross toolchain instead. No openssl-sys
      # in the tree, so no arm64 libssl package is needed.
      - name: Install aarch64 host cross toolchain
        if: matrix.host_cross == true
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        shell: bash
        env:
          # Target-specific only: ignored by non-aarch64 builds. The host
          # cross toolchain (installed above for host_cross jobs) supplies
          # the complete C++ headers that the cross-rs image lacks.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }} --bins

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist mcpb-pack
          BIN="target/${{ matrix.target }}/release/strut-stack-sql"
          test -x "$BIN"
          if [ "${{ matrix.check_size }}" = "true" ]; then
            SIZE=$(wc -c < "$BIN")
            echo "binary_size_bytes=$SIZE"
            if [ "$SIZE" -gt "$MAX_LINUX_X64_BYTES" ]; then
              echo "ERROR: binary $SIZE bytes exceeds budget $MAX_LINUX_X64_BYTES" >&2
              exit 1
            fi
          fi
          cp "$BIN" mcpb-pack/strut-stack-sql
          cp mcpb/manifest.json mcpb-pack/manifest.json
          cp "$BIN" "dist/strut-stack-sql"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist strut-stack-sql
          rm "dist/strut-stack-sql"

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/strut-stack-sql.exe"
          Copy-Item $bin "dist/strut-stack-sql.exe"
          Compress-Archive -Path "dist/strut-stack-sql.exe" -DestinationPath "dist/${{ matrix.asset }}.zip" -Force
          Remove-Item "dist/strut-stack-sql.exe"

      - uses: actions/setup-node@v4
        if: matrix.os == 'windows-latest'
        with:
          node-version: "20"

      # Windows used to ship only the .zip; server.json (MCP Registry) also
      # lists a windows-x64 .mcpb package, so build it: same manifest with the
      # entry point pointed at the .exe.
      - name: Package MCPB bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p mcpb-pack-win
          cp "target/${{ matrix.target }}/release/strut-stack-sql.exe" mcpb-pack-win/strut-stack-sql.exe
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('mcpb/manifest.json','utf8'));m.server.entry_point='strut-stack-sql.exe';m.server.mcp_config.command='\${__dirname}/strut-stack-sql.exe';fs.writeFileSync('mcpb-pack-win/manifest.json',JSON.stringify(m,null,2))"
          npm install -g @anthropic-ai/mcpb
          mcpb pack mcpb-pack-win "dist/${{ matrix.asset }}.mcpb"

      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-latest'
        with:
          node-version: "20"

      - name: Package MCPB bundle
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb pack mcpb-pack "dist/${{ matrix.asset }}.mcpb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/

  conformance:
    name: Release gate (tests + MCP conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Full test suite
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Repo conformance runner (stdio + Streamable HTTP)
        run: scripts/conformance/run.sh --json-out target/conformance/report.json

      - name: Six-client configuration matrix
        run: >-
          python3 scripts/conformance/check_clients.py
          --binary target/release/strut-stack-sql
          --json-out target/conformance/clients.json

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: target/conformance/
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
