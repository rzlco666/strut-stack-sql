name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest description lists all six engines
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open("mcpb/manifest.json"))["description"]
          server = json.load(open("server.json"))["description"]
          engines = ["MySQL", "PostgreSQL", "SQLite", "DuckDB", "SQL Server", "ClickHouse"]
          for name, desc in (("mcpb/manifest.json", manifest), ("server.json", server)):
              idx = [desc.find(e) for e in engines]
              assert all(i >= 0 for i in idx), f"{name} is missing an engine: {desc}"
              assert idx == sorted(idx), f"{name} engines out of order: {desc}"
          print("manifest:", manifest)
          print("server.json:", server)
          PY

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

  conformance:
    name: MCP conformance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Repo conformance runner (stdio + Streamable HTTP)
        run: scripts/conformance/run.sh --json-out target/conformance/report.json

      - name: Six-client configuration matrix
        run: >-
          python3 scripts/conformance/check_clients.py
          --binary target/release/strut-stack-sql
          --json-out target/conformance/clients.json

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: target/conformance/
          if-no-files-found: warn

  integration-http-docker:
    name: HTTP Integration (PG + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demo
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Seed PostgreSQL
        env:
          PGPASSWORD: demo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          for i in $(seq 1 30); do
            psql "postgresql://demo:demo@localhost:5433/demo" -c "SELECT 1" && break
            sleep 2
          done
          psql "postgresql://demo:demo@localhost:5433/demo" -f docker/seed/postgres.sql

      - name: Seed MySQL
        run: |
          sudo apt-get install -y -qq default-mysql-client > /dev/null
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "SELECT 1" && break
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3307 -uroot -proot demo < docker/seed/mysql.sql

      - name: HTTP integration tests (PG + MySQL)
        env:
          POSTGRES_DATABASE_URL: postgresql://demo:demo@localhost:5433/demo
          MYSQL_DATABASE_URL: mysql://demo:demo@127.0.0.1:3307/demo
        run: cargo test --test http_integration -- --ignored

  integration-mysql:
    name: MySQL Integration (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: MySQL integration tests
        env:
          MYSQL_DATABASE_URL: ${{ secrets.MYSQL_DATABASE_URL }}
        run: |
          if [ -z "$MYSQL_DATABASE_URL" ]; then
            echo "Skipping MySQL integration tests — set MYSQL_DATABASE_URL repo secret to enable."
          else
            cargo test --test mysql_integration -- --ignored
          fi

  integration-clickhouse:
    name: ClickHouse Integration
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8124:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: ClickHouse driver integration tests
        env:
          CLICKHOUSE_URL: clickhouse://default:@127.0.0.1:8124/default
        run: cargo test -p strut-sql-driver-clickhouse -- --ignored

  lint:
    name: Lint (fmt, clippy, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Dependency vulnerability scan (RustSec advisory DB).
      # Plain `cargo audit` (not the audit-check action) so the run does not
      # depend on check-run creation permissions; ignores live in
      # .cargo/audit.toml with per-advisory justifications.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
