name: Registry Publish

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to MCP Registry
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned, do not float on "latest": bump MCP_PUBLISHER_VERSION in a
      # reviewed PR (pin verified against the registry repo's release list;
      # v1.8.5 published 2026-10-26).
      - name: Download mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "v1.8.5"
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Sync server.json from latest release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName | sed 's/^v//')"
          fi
          echo "Publishing version=$VERSION"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"
          TMP="$(mktemp -d)"
          gh release download "v${VERSION}" --repo "$REPO" -p "SHA256SUMS" -D "$TMP"
          hash_for() {
            awk -v f="$1" '$2 == f { print $1; exit }' "${TMP}/SHA256SUMS"
          }
          jq \
            --arg v "$VERSION" \
            --arg linux_x64 "${BASE}/strut-stack-sql-linux-x64.mcpb" \
            --arg linux_x64_h "$(hash_for strut-stack-sql-linux-x64.mcpb)" \
            --arg macos_arm "${BASE}/strut-stack-sql-macos-arm64.mcpb" \
            --arg macos_arm_h "$(hash_for strut-stack-sql-macos-arm64.mcpb)" \
            --arg macos_x64 "${BASE}/strut-stack-sql-macos-x64.mcpb" \
            --arg macos_x64_h "$(hash_for strut-stack-sql-macos-x64.mcpb)" \
            --arg linux_arm "${BASE}/strut-stack-sql-linux-arm64.mcpb" \
            --arg linux_arm_h "$(hash_for strut-stack-sql-linux-arm64.mcpb)" \
            --arg win_x64 "${BASE}/strut-stack-sql-windows-x64.mcpb" \
            --arg win_x64_h "$(hash_for strut-stack-sql-windows-x64.mcpb)" \
            '
            .version = $v
            | .packages[0].identifier = $linux_x64
            | .packages[0].fileSha256 = $linux_x64_h
            | .packages[1].identifier = $macos_arm
            | .packages[1].fileSha256 = $macos_arm_h
            | .packages[2].identifier = $macos_x64
            | .packages[2].fileSha256 = $macos_x64_h
            | .packages[3].identifier = $linux_arm
            | .packages[3].fileSha256 = $linux_arm_h
            | .packages[4].identifier = $win_x64
            | .packages[4].fileSha256 = $win_x64_h
            ' server.json > server.json.tmp
          mv server.json.tmp server.json
          jq '{name, version, packages: [.packages[]|{identifier,fileSha256}]}' server.json
          if jq -e '.packages[] | select((.fileSha256 // "") == "" or .fileSha256 == "UPDATE_AFTER_RELEASE")' server.json >/dev/null; then
            echo "ERROR: server.json still has an empty/placeholder fileSha256; the v${VERSION} release assets are missing or SHA256SUMS did not contain every .mcpb" >&2
            exit 1
          fi
          if jq -e '[.packages[].fileSha256] | (length != (unique | length))' server.json >/dev/null; then
            echo "ERROR: server.json fileSha256 values are not unique (artifacts did not build per platform)" >&2
            exit 1
          fi

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish --file server.json

      - name: Verify registry entry
        run: |
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.rzlco666/strut-stack-sql" | jq .
