<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Strut Stack SQL — Light strut. Extreme load.">
  <!-- Header banner: dark slate field, faint oversized strut motif,
       project mark on the left, wordmark + tagline as SVG text
       (generic sans-serif only, no external fonts). -->
  <rect width="1280" height="320" fill="#0F172A"/>
  <line x1="880" y1="360" x2="1240" y2="0" stroke="#E8590C" stroke-width="26" stroke-linecap="round" opacity="0.16"/>
  <line x1="1010" y1="360" x2="1370" y2="0" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" opacity="0.12"/>

  <!-- mark (dark-background variant), 96x96 scaled x1.7 -->
  <g transform="translate(72 78) scale(1.7)">
    <line x1="12" y1="84" x2="84" y2="12" stroke="#F97316" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 34 v30 a26 9 0 0 0 52 0 v-30 z" fill="#E2E8F0"/>
    <path d="M22 49 a26 9 0 0 0 52 0" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <ellipse cx="48" cy="34" rx="26" ry="9" fill="#F8FAFC"/>
    <ellipse cx="48" cy="34" rx="26" ry="9" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="12" cy="84" r="3.2" fill="#0F172A"/>
    <circle cx="84" cy="12" r="3.2" fill="#0F172A"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F8FAFC">Strut Stack SQL</text>
  <text x="292" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="600" fill="#F59E0B">Light strut. Extreme load.</text>
  <text x="292" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#94A3B8">Rust MCP for PostgreSQL, MySQL, SQLite &amp; SQL Server</text>
</svg>
