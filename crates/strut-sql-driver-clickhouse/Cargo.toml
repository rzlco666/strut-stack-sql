[package]
name = "strut-sql-driver-clickhouse"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "ClickHouse driver for Strut Stack SQL (HTTP interface)"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"

[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
async-trait = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
strut-sql-driver-conformance = { path = "../strut-sql-driver-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
