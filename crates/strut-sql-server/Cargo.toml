[package]
name = "strut-sql-server"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "MCP stdio and HTTP server for Strut Stack SQL"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"

[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
strut-sql-core = { path = "../strut-sql-core" }
strut-sql-guard = { path = "../strut-sql-guard" }
strut-sql-tools = { path = "../strut-sql-tools" }
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
rmcp = { version = "2", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
    "elicitation",
] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
strut-sql-driver-sqlite = { path = "../strut-sql-driver-sqlite" }
tower = { version = "0.5", features = ["util"] }
