[package]
name = "strut-sql-driver-postgres"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "PostgreSQL driver for Strut Stack SQL"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"

[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "chrono",
    "uuid",
    "bigdecimal",
] }
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
strut-sql-driver-conformance = { path = "../strut-sql-driver-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
