[package]
name = "strut-sql-driver-duckdb"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Embedded DuckDB driver for Strut Stack SQL"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"

[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled", "chrono"] }
async-trait = "0.1"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"

[dev-dependencies]
strut-sql-driver-conformance = { path = "../strut-sql-driver-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
