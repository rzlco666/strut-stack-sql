[package]
name = "strut-sql-driver-sqlserver"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "SQL Server driver for Strut Stack SQL"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"

[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono", "bigdecimal"] }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
serde_json = "1"
roxmltree = "0.20"

[dev-dependencies]
strut-sql-driver-conformance = { path = "../strut-sql-driver-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
