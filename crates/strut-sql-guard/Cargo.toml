[package]
name = "strut-sql-guard"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
description = "SQL guard, classification and LIMIT enforcement for Strut Stack SQL"
license = "MIT"
repository = "https://github.com/rzlco666/strut-stack-sql"
[dependencies]
strut-sql-driver-api = { path = "../strut-sql-driver-api" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.62"
thiserror = "2"
